# Lint, scan for secrets, test and build the MKP on every push to main, every
# pull request (including Dependabot branches), and on demand ("Run workflow").
# Actions are pinned by commit SHA; Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs exactly the hooks from .pre-commit-config.yaml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # --locked fails the job if uv.lock is out of date with pyproject.toml
      - name: Run pre-commit
        run: uv run --locked --only-group lint pre-commit run --all-files --show-diff-on-failure

  # Scans the git history of the pushed / pull request commits
  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits via the API
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with the gitleaks rev in .pre-commit-config.yaml
          GITLEAKS_VERSION: "8.30.1"
          # PR comments would need pull-requests: write
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Type check, offline test suite, schema drift and MKP build — inside the
  # project's dev container (same image as local `make`).
  checks:
    name: typecheck + test + package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Type check (mypy)
        run: make typecheck

      - name: Test (pytest, network-free)
        run: make test

      - name: Schema drift check
        run: |
          make schema
          git diff --exit-code -- schema

      - name: Build MKP
        run: make mkp

      # On main, the MKP is kept as a workflow artifact for each commit.
      - name: Upload MKP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: synmon-mkp-${{ github.sha }}
          path: dist/*.mkp
          if-no-files-found: error
          retention-days: 90

  # Loads every MKP plug-in with Checkmk's own loaders and runs the MKP lib
  # tests on the real Checkmk libraries (and Python) of each supported
  # version. -latest tags keep the matrix free of version maintenance and test
  # each new patch release; deliberately not digest-pinned. The job gets no
  # secrets and only a read token, which is not persisted in .git/config.
  pytest:
    name: pytest (Checkmk ${{ matrix.checkmk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkmk: "2.4"
            image: docker.io/checkmk/check-mk-cloud:2.4.0-latest
          - checkmk: "2.5"
            # Ultimate = the 2.5 name of the Cloud Edition
            image: docker.io/checkmk/check-mk-ultimate:2.5.0-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      # The Checkmk image has no uv: hand it the test group with the uv.lock hashes.
      - name: Export test requirements
        run: >-
          uv export --locked --only-group test --no-emit-project --no-emit-workspace
          --output-file .cache/checkmk-test-requirements.txt
      - name: Run pytest
        run: docker run --rm -v "$PWD:/source:ro" --entrypoint /source/tests/checkmk/run-pytest.sh "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}

  # The live tests run inside the digest-pinned Playwright image (`make integration`): the browser
  # comes from the image, Python packages only from the uv.lock hashes.
  integration:
    name: live browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run live tests against the mock site
        run: make integration

  # Runs deploy/install.sh for real in a RHEL 9 rebuild (AlmaLinux 9): users, permissions,
  # allowlist, rendered units (checked by Podman's Quadlet generator), idempotent re-run.
  deploy:
    name: deploy (install.sh on AlmaLinux 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run install.sh and check the result
        run: make test-deploy

  # Builds each executor image variant the air-gapped way (offline install from the hashed
  # wheelhouse) and runs it hardened, as deploy/synmon-executor.container does, against the
  # mock site: ubi9 (default, Red Hat UBI 9) and playwright (the Playwright-supported image).
  image:
    name: executor image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ubi9, playwright]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheelhouse
        run: make wheelhouse

      - name: Build image
        run: make image

      - name: Run image against the mock site
        run: make image-test

      # RHEL 9's Podman seccomp profile (from the containers-common package of the RHEL rebuild
      # AlmaLinux 9): it allows the user-namespace sandbox that Docker's default profile blocks.
      - name: Fetch the RHEL 9 Podman seccomp profile
        run: >-
          docker run --rm "$ALMALINUX"
          sh -c 'microdnf install -y containers-common >/dev/null && cat /usr/share/containers/seccomp.json'
          >"$RUNNER_TEMP/rhel9-seccomp.json"
        env:
          ALMALINUX: docker.io/library/almalinux:9-minimal@sha256:8e56ca192f602eb1c486b870f268730f4b08179b43845184a3623c6634f5d01a

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor; RHEL has no
      # such restriction (and no AppArmor), so lift it to mirror a RHEL worker.
      - name: Allow unprivileged user namespaces (as on RHEL)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run image with Chromium's own sandbox (install.sh --chromium-sandbox)
        run: make image-test SECCOMP_PROFILE="$RUNNER_TEMP/rhel9-seccomp.json"

  # On main, once every other job passed: release from the Conventional Commit subjects since the
  # last tag (pyproject.toml [tool.semantic_release]): feat -> minor, fix/perf -> patch, "!" ->
  # major; build/ci/chore/docs/refactor/style/test release nothing. python-semantic-release
  # stamps checkmk_mkp/manifest.json, builds the MKP, commits "chore(release): vX.Y.Z", tags and
  # creates the GitHub Release; the next step attaches the MKP. To recover from a failed run,
  # re-run this job.
  release:
    name: release
    needs: [lint, secrets, checks, pytest, integration, image, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release pushes with GH_TOKEN; keep the token out of .git/config.
          persist-credentials: false

      # Release exactly the commit CI tested; the push is rejected if main moved meanwhile.
      - name: Check out main at the tested commit
        run: git switch -C main "$GITHUB_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # From uv.lock (hash-checked), not the semantic-release action, whose image pip-installs
      # unpinned dependencies at run time.
      - name: Version, tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked --only-group release semantic-release version --no-changelog

      # Idempotent: attaches the MKP if missing (e.g. on a re-run), never replaces an asset.
      # Without a new release, the asset of the current version is already there.
      - name: Attach the MKP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 scripts/build_mkp.py --print-version)"
          asset="synmon-${version}.mkp"
          if gh release view "v${version}" --json assets --jq '.assets[].name' | grep -qxF "${asset}"; then
            echo "v${version} already has ${asset}."
          else
            python3 scripts/build_mkp.py
            gh release upload "v${version}" "dist/${asset}"
          fi

  # Merge Dependabot minor/patch updates of the uv and pre-commit ecosystems
  # once every other job has passed. Docker and GitHub Actions updates, all
  # major updates and Playwright (the browser) are left open for manual review.
  #
  # Gated with `needs:` here instead of a separate workflow with
  # `gh pr merge --auto`: auto-merge relies on a branch ruleset requiring
  # these checks (without one, --auto would merge before CI finishes), and
  # this keeps the gate in the repository instead of in repository settings.
  dependabot-merge:
    name: Auto-merge Dependabot (uv / pre-commit, minor + patch)
    needs: [lint, secrets, checks, pytest, integration, image, deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # No approval: no ruleset requires one, and the repository does not let
      # GitHub Actions approve pull requests (least privilege).
      - name: Squash-merge
        if: >-
          contains(fromJSON('["uv", "pre_commit"]'), steps.metadata.outputs.package-ecosystem) &&
          !contains(steps.metadata.outputs.dependency-names, 'playwright') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
