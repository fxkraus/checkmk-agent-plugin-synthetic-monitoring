name: Release

# Runs when a version tag is pushed, and on demand from the Actions tab ("Run workflow").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (blank = v<manifest version>)"
        required: false
        default: ""

# The release job needs to create tags/releases and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build MKP and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # build_mkp.py is standard-library only, so no dependencies are installed here.
      - name: Build MKP
        run: python3 scripts/build_mkp.py

      - name: Resolve release tag
        id: meta
        env:
          # Untrusted dispatch input is read through the environment (never inlined into the shell).
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 scripts/build_mkp.py --print-version)"
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              tag="$REF_NAME"
            else
              tag="v${version}"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag (package version $version)"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes="$(printf 'Checkmk 2.4/2.5 synthetic-monitoring MKP (synmon %s).\n\nInstall on the Checkmk site:\n    mkp add synmon-%s.mkp\n    mkp enable synmon %s' "$VERSION" "$VERSION" "$VERSION")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its asset."
            gh release upload "$TAG" dist/*.mkp --clobber
          else
            gh release create "$TAG" dist/*.mkp --title "synmon ${VERSION}" --notes "$notes"
          fi
