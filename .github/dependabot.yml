# Dependabot configuration — weekly dependency updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Minor/patch updates are grouped into a single PR per ecosystem. uv and
# pre-commit updates are auto-merged by the dependabot-merge job in
# .github/workflows/ci.yml once all CI checks pass; Docker and GitHub Actions
# updates, all major updates and Playwright need a manual review. The auto-merged
# ecosystems wait 7 days after a release, so a compromised version is likely
# yanked before it is proposed.
#
# Not managed here, on purpose:
# - executor/Containerfile*: the base images are digest-pinned ARG defaults
#   (overridden at build time with the internal mirror) and must match the
#   playwright pin; bumps are a deliberate step. Dependabot also only detects
#   Dockerfile* names and literal FROM tags.
# - .devcontainer/docker-compose.yml: the Checkmk image uses the floating
#   2.5.0-latest tag (Dependabot would propose daily builds as "patch"
#   updates).

version: 2
updates:
  # ── Python dependencies (uv workspace: pyproject.toml + uv.lock) ───────────
  - package-ecosystem: "uv"
    directory: "/"
    # Conventional Commit subject that releases nothing (build(deps): Bump ...)
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Playwright bundles the monitoring browser (Chromium runs unsandboxed
      # against monitored pages), so it must not fall behind. Its own PR is
      # never auto-merged: tests/test_playwright_pins.py fails it until the
      # Playwright image tag + digest (Containerfiles, Makefile) are bumped
      # in the same PR.
      playwright:
        patterns:
          - "playwright"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── Docker (dev container: Python base image + uv) ─────────────────────────
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    # Conventional Commit subject that releases nothing (build(deps): Bump ...)
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      # The executor image runs Python 3.12 (air-gap pin, see CLAUDE.md); the
      # dev container must match it.
      - dependency-name: "python"
        versions: [">= 3.13"]

  # ── pre-commit hooks ───────────────────────────────────────────────────────
  - package-ecosystem: "pre-commit"
    directory: "/"
    # Conventional Commit subject that releases nothing (build(deps): Bump ...)
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    # Conventional Commit subject that releases nothing (ci(deps): Bump ...)
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
