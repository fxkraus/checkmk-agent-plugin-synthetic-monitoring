[project]
name = "synmon"
version = "0.0.0"
description = "Checkmk synthetic monitoring (worker producer subsystem)"
requires-python = ">=3.12"
license = "MIT"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contract", "executor"]

[tool.uv.sources]
synmon-contract = { workspace = true }
synmon-executor = { workspace = true }

# Exact pins (air-gap reproducibility); Dependabot keeps them current.
[dependency-groups]
# Installed into the Checkmk interpreter by tests/checkmk/run-pytest.sh
test = ["pytest==9.1.1"]
# Used by the CI lint job
lint = ["pre-commit==4.6.2"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
    "ruff==0.16.9",
    "mypy==2.3.1",
    "jsonschema==4.26.0",
    "synmon-contract",
    "synmon-executor",
]
# Used by the CI release job (see [tool.semantic_release])
release = [
    "python-semantic-release==10.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["contract/src", "executor/src", "checkmk_mkp/cmk_addons/plugins/synmon/lib", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "tests/server", "tests/integration/mocksite", "contract/tests", "executor/tests", "agent_plugin/tests"]

# Releases are cut by CI on every push to main from the Conventional Commit subjects since the
# last tag (feat -> minor, fix/perf -> patch, "!"/BREAKING CHANGE -> major). The released artifact
# is the MKP, so the version lives in checkmk_mkp/manifest.json. scripts/check_commits.py
# enforces the subject format on pull requests and in the commit-msg hook.
[tool.semantic_release]
# Not version_variables: its pattern also rewrites "version.min_required" in the JSON manifest.
# build_mkp.py stamps the manifest and builds dist/synmon-<version>.mkp in one step.
build_command = "python3 scripts/build_mkp.py --set-version \"$NEW_VERSION\""
assets = ["checkmk_mkp/manifest.json"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
# A squash merge's title (checked in CI) decides the bump, not the squashed commit list.
parse_squash_commits = false

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
