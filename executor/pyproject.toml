[project]
name = "synmon-executor"
version = "1.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "synmon-contract",
    "playwright==1.49.0",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synmon_executor"]

[tool.uv.sources]
synmon-contract = { workspace = true }
