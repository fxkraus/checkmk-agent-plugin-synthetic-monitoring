# Air-gapped GitLab runners: mirrors .github/workflows/ci.yml as far as an air gap allows.
# Before enabling it on the real runners, mirror the images below (pinned by digest) to the
# internal registry, point UV_INDEX_URL / PIP_INDEX_URL at the internal PyPI, and mirror the
# Checkmk image. pre-commit is not used: its hooks are fetched from GitHub at run time, so the
# same tools run as pinned images instead. The live browser and executor image jobs stay on
# GitHub (they need the Playwright image and a container engine).
stages:
  - lint
  - schema
  - test
  - build

variables:
  UV_LINK_MODE: copy
  # Never download a Python interpreter; use the one in the image.
  UV_PYTHON_DOWNLOADS: never

# uv 0.9.30 wrote the current uv.lock (revision 3); older uv releases rewrite or misread it.
.uv:
  image: ghcr.io/astral-sh/uv:0.9.30-python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
  before_script:
    # --locked fails the job if uv.lock is out of date with pyproject.toml
    - uv sync --locked

lint:
  extends: .uv
  stage: lint
  script:
    - uv run --locked ruff check .
    - uv run --locked ruff format --check .
    - uv run --locked mypy

# Keep the image versions in sync with the revs in .pre-commit-config.yaml
hadolint:
  stage: lint
  image: hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
  script:
    - hadolint --config .hadolint.yaml executor/Containerfile executor/Containerfile.playwright .devcontainer/Dockerfile

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
  script:
    # .shellcheckrc (enable=all) is picked up from the repository root
    - shellcheck deploy/install.sh scripts/*.sh tests/checkmk/run-pytest.sh tests/integration/run-live.sh

secrets:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    # Full history, like the GitHub secrets job and `make secrets`
    GIT_DEPTH: 0
  script:
    - gitleaks git --redact --verbose .

schema-sync:
  extends: .uv
  stage: schema
  script:
    - uv run --locked python -m synmon_contract.schema_export /tmp/schema-out
    - diff -ru schema /tmp/schema-out

test:
  extends: .uv
  stage: test
  script:
    - uv run --locked pytest -q

# Loads every MKP plug-in with Checkmk's own loaders (tests/checkmk/run-pytest.sh). The Checkmk
# image has no uv, so the hashed test requirements come from the export job.
checkmk-requirements:
  extends: .uv
  stage: test
  before_script: []
  script:
    - uv export --locked --only-group test --no-emit-project --no-emit-workspace --output-file .cache/checkmk-test-requirements.txt
  artifacts:
    paths:
      - .cache/checkmk-test-requirements.txt
    expire_in: 1 day

checkmk:
  stage: build
  needs: [checkmk-requirements]
  parallel:
    matrix:
      - CHECKMK_IMAGE:
          - checkmk/check-mk-cloud:2.4.0-latest
          - checkmk/check-mk-ultimate:2.5.0-latest
  image:
    name: $CHECKMK_IMAGE
    entrypoint: [""]
  script:
    - tests/checkmk/run-pytest.sh -q

# The .mkp is built with a stdlib-only script, so no Checkmk site/image is needed here.
mkp:
  extends: .uv
  stage: build
  before_script: []
  script:
    - python3 scripts/build_mkp.py
  artifacts:
    paths:
      - dist/*.mkp
